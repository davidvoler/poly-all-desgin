<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Course · Create with AI — Polyglots</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="assets/app.css" />
</head>
<body class="bg course-page">
  <div class="page-topbar">
    <a href="index.html" class="back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      My courses
    </a>
    <div class="page-title" id="chatCourseTitle">Course</div>
  </div>

  <div class="workshell">

    <!-- Left: purpose-built chat -->
    <section class="chat-col">
      <div class="chat-head">
        <div class="chat-head-main">
          <div class="s" id="chatCourseSub">Language → Language · Level</div>
        </div>
        <div class="chat-usage" id="chatUsage"></div>
      </div>
      <div class="chat-scroll" id="chatScroll"></div>
      <form class="chat-input" id="chatForm">
        <textarea id="chatText" rows="1" placeholder="Tell the AI what you want, or use a button above…"></textarea>
        <button class="chat-send" type="submit" id="chatSend" title="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        </button>
      </form>
    </section>

    <!-- Right pane: workspace (words / lessons / edit / preview) -->
    <aside class="leftpane">
      <div class="work-tabs" id="workTabs">
        <button data-tab="words" class="on">Words</button>
        <button data-tab="lessons">Lessons</button>
        <button data-tab="edit">Edit Course</button>
        <button data-tab="preview">Preview</button>
      </div>
      <div class="work-scroll" id="workScroll"></div>
    </aside>

  </div>

  <script src="assets/store.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
