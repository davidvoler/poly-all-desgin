[pytest]
# Async tests are plain `async def` — no per-test decorator needed.
asyncio_mode = auto
# One event loop for the whole session: utils.db_content caches its
# connection on a module global and utils.ollama_simple holds one client,
# both bound to the loop they were created on.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    ollama: exercises a real Ollama model (slow; needs Ollama reachable)
    db: exercises the real content Postgres (needs postgres_content up)

filterwarnings =
    ignore::DeprecationWarning
