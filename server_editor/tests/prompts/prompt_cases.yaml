# Add a new run below when you want to compare a prompt change.
# Keep the comment field specific so it is visible beside that run in the output.
runs:
  - name: text quiz in Spanish
    target: prompts.text_quiz:get_text_quiz
    comment: Baseline Spanish quiz prompt.
    args:
      language: English
      to_language: Spanish
      text: The curious student opened the old book.
      level: A2
      provider: ollama
      model: gemma4

  - name: text parts in German
    target: prompts.break_text_parts:get_text_parts
    comment: Compare sentence splitting after the prompt wording change.
    args:
      language: German
      to_language: English
      text: Der neugierige Student öffnete das alte Buch.
      level: A2
      provider: ollama
      model: muse-glimmer

  - name: single choice for wander
    target: prompts.single_choice:get_single_choice
    comment: Check whether the distractors remain plausible.
    args:
      word: wander
      num_sentences: 2
      provider: ollama
      model: gemma4

  - name: sentence translation for libro
    target: prompts.sentence:get_sentence_translation
    comment: Spanish vocabulary comparison run.
    args:
      word: libro
      num_sentences: 2
      provider: ollama
      model: muse-glimmer