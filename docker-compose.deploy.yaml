
services:
  server:
    container_name: server
    image: server:polyglots
    build:
      context: server
      dockerfile: Dockerfile.dev
    ports:
      - 8004:8004
    volumes:
      - ./server:${PWD}/server
    working_dir: ${PWD}/server/src
    # environment: *server-env
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8004"
      - --reload
  editor:
    container_name: editor
    image: editor:polyglots
    build:
      context: server_editor
      dockerfile: Dockerfile.dev
    ports:
      - 8006:8006
    volumes:
      - ./server_editor:${PWD}/server_editor
    working_dir: ${PWD}/server_editor/src
    # environment: *server-env
    env_file: .env
    
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8006"
      - --reload
  broker-editor:
    container_name: broker-editor
    image: editor:polyglots
    command:
      - taskiq
      - worker
      - task_runner:broker
      # task modules to import so their @broker.task fns register on the worker
      - tasks.prompt_tasks
      - -fsd
      - --log-level 
      - INFO
      - --reload
    volumes:
      - ./server_editor:${PWD}/server_editor
    working_dir: ${PWD}/server_editor/src
    # environment: *server-env
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
networks:
  databases:
    external: true
    