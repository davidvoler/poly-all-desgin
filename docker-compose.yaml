 services:
  postgres:
    container_name: postgres
    image: postgres:17.4
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: polyglots
      POSTGRES_PASSWORD: polyglots
      POSTGRES_DB: polyglots
      shared_buffers: 4GB 
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    shm_size: 4GB
  postgres_content:
    container_name: postgres_content
    image: postgres:17.4
    ports:
      - 5433:5432
    environment:
      POSTGRES_USER: polyglots
      POSTGRES_PASSWORD: polyglots
      POSTGRES_DB: polyglots
      shared_buffers: 4GB 
    volumes:
      - ./data/postgres_full:/var/lib/postgresql/data
    shm_size: 4GB


  server:
    container_name: server
    image: server:polyglots
    build:
      context: server
      dockerfile: Dockerfile.dev
    ports:
      - 8004:8004
    volumes:
      - ./server/src:/app
    environment:
      - POSTGRES_DB=polyglots
      - POSTGRES_PORT=5432
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=polyglots
      - POSTGRES_PASSWORD=polyglots
      - POSTGRES_CONTENT_PORT=5432
      - POSTGRES_CONTENT_HOST=postgres_content
      - POSTGRES_CONTENT_USER=polyglots
      - POSTGRES_CONTENT_PASSWORD=polyglots
      # Auth0 — leave blank to disable. When AUTH0_DOMAIN is set, the
      # /api/v1/school_users/login_auth0 route verifies ID tokens
      # against the tenant JWKS; otherwise it returns 503 and the
      # dashboard falls back to the local password flow.
      - AUTH0_DOMAIN=${AUTH0_DOMAIN:-}
      - AUTH0_AUDIENCE=${AUTH0_AUDIENCE:-}
      - AUTH0_CLIENT_ID=${AUTH0_CLIENT_ID:-}
      - ENABLE_DOCS=true
      - COOKIE_SECURE=false
      # Local LLM inference (see utils/ollama_client.py) — Ollama runs on
      # the host, not in this compose file. host.docker.internal is
      # Docker Desktop's built-in alias for the host on Mac/Windows; the
      # extra_hosts entry below makes the same alias work on Linux too.
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8004"
      - --reload
    depends_on:
      - postgres

  redis:
    container_name: redis
    hostname: redis
    image: redis:7.2
    ports:
      - 6379:6379


  broker:
    container_name: broker
    image: server:polyglots
    command:
      - taskiq 
      - worker 
      - tasks.broker:broker 
      - -fsd
    volumes:
      - ./server/src:/app
    depends_on:
      - redis

  audio-server:
    container_name: audio-server
    image: nginx:alpine
    ports:
      - "0.0.0.0:3002:3002"
    volumes:
      - ./conf/audio.conf:/etc/nginx/conf.d/default.conf
      - ./data/audio:/usr/share/nginx/audio/audio
  # web:
  #   container_name: web
  #   image: nginx:alpine
  #   ports:
  #     - "0.0.0.0:3000:3000"
  #   volumes:
  #     - ./build_web/web:/usr/share/nginx/html
  #     - ./conf/web.conf:/etc/nginx/conf.d/default.conf