# Shared by `server` (FastAPI) and `broker` (taskiq worker) — the worker
# runs the generate_poc_new jobs, so it needs the same DB + Ollama access.
x-server-env: &server-env
  - POSTGRES_DB=polyglots
  - POSTGRES_PORT=5432
  - POSTGRES_HOST=postgres
  - POSTGRES_USER=polyglots
  - POSTGRES_PASSWORD=polyglots
  - POSTGRES_CONTENT_PORT=5432
  - POSTGRES_CONTENT_HOST=postgres_content
  - POSTGRES_CONTENT_USER=polyglots
  - POSTGRES_CONTENT_PASSWORD=polyglots
  - AUTH0_DOMAIN=${AUTH0_DOMAIN:-}
  - AUTH0_AUDIENCE=${AUTH0_AUDIENCE:-}
  - AUTH0_CLIENT_ID=${AUTH0_CLIENT_ID:-}
  - ENABLE_DOCS=true
  - COOKIE_SECURE=false
  - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  - REDIS_HOST=redis
  - REDIS_PORT=6379

services:
  postgres:
    container_name: postgres
    image: postgres:17.4
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: polyglots
      POSTGRES_PASSWORD: polyglots
      POSTGRES_DB: polyglots
      shared_buffers: 4GB 
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    shm_size: 4GB
  postgres_content:
    container_name: postgres_content
    image: postgres:17.4
    ports:
      - 5433:5432
    environment:
      POSTGRES_USER: polyglots
      POSTGRES_PASSWORD: polyglots
      POSTGRES_DB: polyglots
      shared_buffers: 4GB 
    volumes:
      - ./data/postgres_full:/var/lib/postgresql/data
    shm_size: 4GB


  server:
    container_name: server
    image: server:polyglots
    build:
      context: server
      dockerfile: Dockerfile.dev
    ports:
      - 8004:8004
    volumes:
      - ./server/src:/app
    environment: *server-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8004"
      - --reload
    depends_on:
      - postgres

  redis:
    container_name: redis
    hostname: redis
    image: redis:7.2
    ports:
      - 6379:6379


  broker:
    container_name: broker
    image: server:polyglots
    command:
      - taskiq
      - worker
      - tasks.broker:broker
      # task modules to import so their @broker.task fns register on the worker
      - routers.generate_poc_task
      - -fsd
    volumes:
      - ./server/src:/app
    environment: *server-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
      - postgres

  audio-server:
    container_name: audio-server
    image: nginx:alpine
    ports:
      - "0.0.0.0:3002:3002"
    volumes:
      - ./conf/audio.conf:/etc/nginx/conf.d/default.conf
      - ./data/audio:/usr/share/nginx/audio/audio
  # web:
  #   container_name: web
  #   image: nginx:alpine
  #   ports:
  #     - "0.0.0.0:3000:3000"
  #   volumes:
  #     - ./build_web/web:/usr/share/nginx/html
  #     - ./conf/web.conf:/etc/nginx/conf.d/default.conf