services:
  postgres:
    container_name: postgres
    image: postgres:17.4
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: polyglots
      POSTGRES_PASSWORD: polyglots
      POSTGRES_DB: polyglots
      shared_buffers: 4GB 
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./data/backup:/tmp/backup

    shm_size: 4GB
  postgres_content:
    container_name: postgres_content
    image: postgres:17.4
    ports:
      - 5433:5432
    environment:
      POSTGRES_USER: polyglots
      POSTGRES_PASSWORD: polyglots
      POSTGRES_DB: polyglots
      shared_buffers: 4GB 
    volumes:
      - ./data/postgres_full:/var/lib/postgresql/data
    shm_size: 4GB


  server:
    container_name: server
    image: server:polyglots
    build:
      context: server
      dockerfile: Dockerfile.dev
    ports:
      - 8004:8004
    volumes:
      - ./server:${PWD}/server
    working_dir: ${PWD}/server/src
    # environment: *server-env
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8004"
      - --reload
    depends_on:
      - postgres

  redis:
    container_name: redis
    hostname: redis
    image: redis:7.2
    ports:
      - 6379:6379



  audio-server:
    container_name: audio-server
    image: nginx:alpine
    ports:
      - "0.0.0.0:3002:3002"
    volumes:
      - ./conf/audio.conf:/etc/nginx/conf.d/default.conf
      - ./data/audio:/usr/share/nginx/audio/audio
  # web:
  #   container_name: web
  #   image: nginx:alpine
  #   ports:
  #     - "0.0.0.0:3000:3000"
  #   volumes:
  #     - ./build_web/web:/usr/share/nginx/html
  #     - ./conf/web.conf:/etc/nginx/conf.d/default.conf


  editor:
    container_name: editor
    image: editor:polyglots
    build:
      context: server_editor
      dockerfile: Dockerfile.dev
    ports:
      - 8006:8006
    volumes:
      - ./server_editor:${PWD}/server_editor
    working_dir: ${PWD}/server_editor/src
    # environment: *server-env
    env_file: .env
    
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8006"
      - --reload
    depends_on:
      - postgres

  broker-editor:
    container_name: broker-editor
    image: editor:polyglots
    command:
      - taskiq
      - worker
      - task_runner:broker
      # task modules to import so their @broker.task fns register on the worker
      - tasks.prompt_tasks
      - -fsd
      - --log-level 
      - INFO
      - --reload
    
    volumes:
      - ./server_editor:${PWD}/server_editor
    working_dir: ${PWD}/server_editor/src
    # environment: *server-env
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
      - postgres