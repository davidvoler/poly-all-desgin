server {
    server_name school1.app.polyglots.social;

    root /home/davidle/dev/poly-all-desgin/deploy/html/app/web;
    index index.html;

    # Long-cache hashed Flutter build assets (main.dart.js, *.png, etc.)
    # but never the entrypoint — flutter rewrites index.html on every
    # build and we want clients to pick up new bundles immediately.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl;                            # managed by Certbot
    listen [::]:443 ssl;                       # managed by Certbot
    ssl_certificate     /etc/letsencrypt/live/school1.app.polyglots.social/fullchain.pem;     # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/school1.app.polyglots.social/privkey.pem;       # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;                                  # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;                                    # managed by Certbot
}

