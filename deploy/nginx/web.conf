server {
    server_name www.polyglots.social;
    root /home/david/dev/polyglot/poly-all-desgin/deploy/html/www;
    index index.html;
    # Marketing pages are flat HTML — no SPA fallback needed.
    location / {
        try_files $uri $uri/ =404;
    }

    listen 443 ssl;                            # managed by Certbot
    listen [::]:443 ssl;                       # managed by Certbot
    ssl_certificate     /etc/letsencrypt/live/www.polyglots.social/fullchain.pem;     # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/www.polyglots.social/privkey.pem;       # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;                                  # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;                                    # managed by Certbot
}

server {
    if ($host = www.polyglots.social) {
        return 301 https://$host$request_uri;
    } # managed by Certbot
	listen [::]:80 ;
    server_name www.polyglots.social;
    return 404; # managed by Certbot
}